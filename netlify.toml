# Netlify: builds the Flutter web app and publishes it.
# Point a Netlify site at this repository and it deploys on every push.

[build]
  command = "bash tool/netlify_build.sh"
  publish = "build/web"

[build.environment]
  # The Flutter release the site is developed and tested with.
  FLUTTER_VERSION = "3.29.3"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
