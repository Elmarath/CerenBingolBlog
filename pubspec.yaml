name: ceren_bingol_blog
description: "Meowdical Notes: Ceren Bingöl's cat-themed study diary on the road to TUS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  go_router: ^17.0.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/generated/
    # >>> content (generated by `dart run tool/content.dart sync`, do not edit)
    - content/
    - content/blog/
    - content/roadmap/
    - content/roadmap/basic/
    - content/roadmap/clinical/
    - content/roadmap/minor/
    # <<< content
