<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /sub/path/` when hosting under a sub path. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meowdical Notes: Ceren Bingöl's cat-themed study diary on the road to TUS. Study notes, plans and a paw-print roadmap of every subject.">
  <meta name="theme-color" content="#FFF7F3">

  <!-- Link previews (WhatsApp, Instagram, X…). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Meowdical Notes">
  <meta property="og:title" content="Meowdical Notes · Ceren Bingöl">
  <meta property="og:description" content="A cat-themed study diary on the road to TUS: study notes, plans and a paw-print roadmap of every subject.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meowdical Notes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Meowdical Notes · Ceren Bingöl</title>
  <link rel="manifest" href="manifest.json">

  <!-- The loading screen is dark if the visitor picked the dark theme last time
       (the site saves it as `flutter.theme`), or prefers dark and never picked one. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('flutter.theme'));
      var dark = saved ? saved === 'midnight-kitty' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #FFF7F3; }
    html.dark, html.dark body { background: #1C1727; }
    #splash {
      --bg: #FFF7F3; --text: #4A2F27; --muted: #8C7067; --accent: #E8668B;
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: var(--bg); color: var(--text);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, "Segoe UI", sans-serif;
      transition: opacity 300ms ease-out;
    }
    .dark #splash { --bg: #1C1727; --text: #F8ECF2; --muted: #A593AE; --accent: #FF8FB3; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .cat { width: 112px; height: 112px; animation: hop 1.1s ease-in-out infinite; }
    /* Paw prints walking across, one after another. */
    .paws { display: flex; gap: 12px; height: 28px; align-items: center; }
    .paws svg { width: 16px; height: 16px; fill: var(--accent); opacity: 0; transform: rotate(90deg); animation: step 1.75s ease-in-out infinite; }
    .paws svg:nth-child(odd) { margin-top: 10px; }
    .paws svg:nth-child(2) { animation-delay: .25s; }
    .paws svg:nth-child(3) { animation-delay: .5s; }
    .paws svg:nth-child(4) { animation-delay: .75s; }
    .paws svg:nth-child(5) { animation-delay: 1s; }
    .wordmark { font-size: 22px; font-weight: 800; letter-spacing: .01em; }
    #status { height: 1.4em; font-size: 14px; color: var(--muted); }
    #status.in { animation: rise 250ms ease-out; }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes step { 0% { opacity: 0; } 15%, 60% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      .cat, #status.in { animation: none; }
      .paws svg { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <!-- The same cat as the logo (lib/widgets/cats/cat_painter.dart). -->
    <svg class="cat" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#4A2F27" stroke="#4A2F27" stroke-width="5.6" stroke-linejoin="round">
        <path d="M12 56 L14 17 Q15 6 24 11 L48 30 Z"/><path d="M88 56 L86 17 Q85 6 76 11 L52 30 Z"/>
        <ellipse cx="50" cy="58" rx="42" ry="34"/>
      </g>
      <g fill="#FFE0BD">
        <path d="M12 56 L14 17 Q15 6 24 11 L48 30 Z"/><path d="M88 56 L86 17 Q85 6 76 11 L52 30 Z"/>
        <ellipse cx="50" cy="58" rx="42" ry="34"/>
      </g>
      <g fill="#FFB6CA">
        <path d="M19.5 37 L20.5 21 Q21.5 15.5 26.5 18.5 L38 28 Z"/><path d="M80.5 37 L79.5 21 Q78.5 15.5 73.5 18.5 L62 28 Z"/>
        <ellipse cx="22" cy="72" rx="6" ry="3.5" opacity=".65"/><ellipse cx="78" cy="72" rx="6" ry="3.5" opacity=".65"/>
      </g>
      <path d="M50 27v8M41.5 29l1.5 6.5M58.5 29l-1.5 6.5" stroke="#F2AE76" stroke-width="3.4" stroke-linecap="round"/>
      <ellipse cx="34" cy="60" rx="5" ry="6.25" fill="#4A2F27"/><ellipse cx="66" cy="60" rx="5" ry="6.25" fill="#4A2F27"/>
      <circle cx="32.2" cy="57.4" r="2.2" fill="#fff"/><circle cx="64.2" cy="57.4" r="2.2" fill="#fff"/>
      <g fill="none" stroke="#4A2F27" stroke-width="2.1" stroke-linecap="round">
        <circle cx="34" cy="60" r="11"/><circle cx="66" cy="60" r="11"/><path d="M45 58.5 Q50 55 55 58.5"/>
        <path d="M50 70.5 Q48.5 76.5 44 75 M50 70.5 Q51.5 76.5 56 75" stroke-width="2.2"/>
        <path d="M20 67 L4 63 M20 72 L5 74.5 M80 67 L96 63 M80 72 L95 74.5" stroke-width="1.3" opacity=".7"/>
      </g>
      <path d="M46 66.5 Q50 64.5 54 66.5 Q52 70.5 50 70.8 Q48 70.5 46 66.5Z" fill="#F08AA8"/>
    </svg>
    <div class="paws" aria-hidden="true">
      <svg viewBox="0 0 100 100"><path d="M50 46C64 46 80 62 78 74C76 86 62 87 50 82C38 87 24 86 22 74C20 62 36 46 50 46Z"/><ellipse cx="19" cy="42" rx="9" ry="12"/><ellipse cx="37" cy="22" rx="9.5" ry="12.5"/><ellipse cx="63" cy="22" rx="9.5" ry="12.5"/><ellipse cx="81" cy="42" rx="9" ry="12"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 46C64 46 80 62 78 74C76 86 62 87 50 82C38 87 24 86 22 74C20 62 36 46 50 46Z"/><ellipse cx="19" cy="42" rx="9" ry="12"/><ellipse cx="37" cy="22" rx="9.5" ry="12.5"/><ellipse cx="63" cy="22" rx="9.5" ry="12.5"/><ellipse cx="81" cy="42" rx="9" ry="12"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 46C64 46 80 62 78 74C76 86 62 87 50 82C38 87 24 86 22 74C20 62 36 46 50 46Z"/><ellipse cx="19" cy="42" rx="9" ry="12"/><ellipse cx="37" cy="22" rx="9.5" ry="12.5"/><ellipse cx="63" cy="22" rx="9.5" ry="12.5"/><ellipse cx="81" cy="42" rx="9" ry="12"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 46C64 46 80 62 78 74C76 86 62 87 50 82C38 87 24 86 22 74C20 62 36 46 50 46Z"/><ellipse cx="19" cy="42" rx="9" ry="12"/><ellipse cx="37" cy="22" rx="9.5" ry="12.5"/><ellipse cx="63" cy="22" rx="9.5" ry="12.5"/><ellipse cx="81" cy="42" rx="9" ry="12"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 46C64 46 80 62 78 74C76 86 62 87 50 82C38 87 24 86 22 74C20 62 36 46 50 46Z"/><ellipse cx="19" cy="42" rx="9" ry="12"/><ellipse cx="37" cy="22" rx="9.5" ry="12.5"/><ellipse cx="63" cy="22" rx="9.5" ry="12.5"/><ellipse cx="81" cy="42" rx="9" ry="12"/></svg>
    </div>
    <div class="wordmark">Meowdical Notes</div>
    <div id="status" aria-live="polite">Sharpening pencils…</div>
  </div>
  <script>
    (function () {
      var lines = [
        'Sharpening pencils…', 'Feeding the cat…', 'Brewing a cup of tea…', 'Flipping flashcards…',
        'Highlighting the important bits…', 'Warming up the stethoscope…', 'Untangling the yarn…',
        'Counting heart sounds…', 'Finding a sunny spot…', 'Opening the atlas…',
      ];
      var status = document.getElementById('status');
      var next = 0;
      var timer = setInterval(function () {
        status.textContent = lines[++next % lines.length];
        status.classList.remove('in');
        void status.offsetWidth; // restarts the animation
        status.classList.add('in');
      }, 900);

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(timer);
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
